[package]
name = "construct"
version = "0.6.3"
description = "Construct - AI-powered development environment"
authors = ["Construct Team"]
edition = "2021"

[lib]
name = "construct_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
# Core plugins (used by frontend)
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

# Core dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "io-util", "net", "sync"] }
portable-pty = "0.8"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
urlencoding = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSResponder", "NSView", "NSApplication", "NSImage", "NSRunningApplication", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
