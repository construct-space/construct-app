[package]
name = "construct"
version = "1.3.1"
description = "Construct - AI-powered development environment"
authors = ["Construct Team"]
edition = "2021"

[lib]
name = "construct_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable", "devtools", "tray-icon", "image-png"] }
# Core plugins (used by frontend)
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = "3"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-decorum = "1.1"

# Core dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "io-util", "net", "sync"] }
portable-pty = "0.8"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
zip = { version = "2", default-features = false }
urlencoding = "2"
url = "2"
chrono = "0.4"
# rustls engine (not the OS schannel — older Windows schannel fails our TLS 1.3
# /ECDSA handshake with SEC_E_ILLEGAL_MESSAGE) + the OS root store via
# rustls-tls-native-roots, so corporate / AV TLS-inspection CAs installed in the
# system store are still trusted. Covers both old Windows and managed networks.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"], default-features = false }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Voice pipeline (behind feature flag — requires native libs that may not build in CI)
whisper-rs = { version = "0.14", features = ["metal"], optional = true }
ort = { version = "2.0.0-rc.12", features = ["coreml"], optional = true }
misaki-rs = { version = "0.3", default-features = false, optional = true }
cpal = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }
rubato = { version = "0.15", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSResponder", "NSView", "NSApplication", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSRunningApplication", "NSColor", "NSMenu", "NSMenuItem", "NSCell"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
voice = ["whisper-rs", "ort", "misaki-rs", "cpal", "hound", "rubato"]
