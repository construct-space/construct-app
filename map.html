#canvas { width: 100vw; height: 100vh; cursor: grab; }
#canvas.dragging { cursor: grabbing; }

/* Detail panel */
#detail {
  position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
  background: #161b22; border-left: 1px solid #30363d; padding: 20px;

#detail.open { right: 0; }
#detail h2 { color: #58a6ff; font-size: 16px; margin-bottom: 4px; }
#detail h3 { color: #8b949e; font-size: 12px; font-weight: normal; margin-bottom: 16px; }
#detail h4 { color: #f0883e; font-size: 13px; margin: 14px 0 6px; }
#detail ul { list-style: none; padding: 0; }
#detail li { padding: 2px 0; color: #c9d1d9; }
#detail li::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
#detail li.file::before { background: #8b949e; }
#detail li.import::before { background: #f97583; }
#detail li.export::before { background: #56d364; }
#detail li.conn::before { background: #d2a8ff; }
#detail .close-btn {
  position: absolute; top: 12px; right: 16px; cursor: pointer;
  color: #8b949e; font-size: 18px; border: none; background: none;
}
#detail .close-btn:hover { color: #c9d1d9; }

/* Legend */
#legend {
  position: fixed; bottom: 16px; left: 16px; background: #161b22;
  border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px;
  font-size: 11px; z-index: 50; color: #8b949e;
}
#legend span { margin-right: 16px; }
#legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* Controls */
#controls {
  position: fixed; top: 16px; left: 16px; background: #161b22;
  border: 1px solid #30363d; border-radius: 6px; padding: 8px 14px;
  font-size: 11px; z-index: 50; color: #8b949e;
}

/* Version badge */
#version {
  position: fixed; top: 16px; right: 16px; background: #161b22;
  border: 1px solid #30363d; border-radius: 6px; padding: 8px 14px;

// ─── Layout engine ──────────────────────────────────────────────────────
const NODE_H = 28, NODE_PAD = 12, LEVEL_GAP = 300, SIBLING_GAP = 10;
const nodes = [], edges = [];

function measureText(text, fontSize) {
  return text.length * fontSize * 0.62 + NODE_PAD * 2;
}

function layoutTree(node, depth, parentAngle, parentX, parentY) {
  const w = measureText(node.label, 13);
  const h = NODE_H;

  if (depth === 0) {
    node._x = 0; node._y = 0; node._w = w; node._h = h;
    nodes.push(node);

    const childCount = node.children ? node.children.length : 0;
    if (node.children) {
      // Distribute main branches: Frontend left-up, Desktop left-down, Operator right
      const angles = [-0.15, -0.85, 0.5]; // in PI units
      node.children.forEach((child, i) => {
        layoutTree(child, depth + 1, angles[i] * Math.PI, 0, 0);
      });
    }
    return;
  }

  const dist = LEVEL_GAP;
  node._x = parentX + Math.cos(parentAngle) * dist;
  node._y = parentY + Math.sin(parentAngle) * dist;
  node._w = w; node._h = h;
  nodes.push(node);
  edges.push({ from: { x: parentX, y: parentY, w: measureText(tree.label, 13), h: NODE_H, node: findParent(node) }, to: node });

  if (node.children && node.children.length > 0) {
    const spread = Math.min(0.6, 0.15 * node.children.length);
    const startAngle = parentAngle - spread * (node.children.length - 1) / 2;
    node.children.forEach((child, i) => {
      const angle = startAngle + spread * i;
      layoutTree(child, depth + 1, angle, node._x, node._y);
    });
  }
}

function findParent(node) {
  function search(n) {
    if (n.children) {
      for (const c of n.children) {
        if (c === node) return n;
        const r = search(c);
        if (r) return r;
      }
    }
    return null;
  }
  return search(tree);
}

// Fix edge connections to use actual parent nodes
function layoutTreeFixed(node, depth, parentAngle, parentNode) {
  const w = measureText(node.label, 13);
  node._w = w; node._h = NODE_H;

  if (depth === 0) {
    node._x = 0; node._y = 0;
    nodes.push(node);

    if (node.children) {
      const angles = [-0.15, -0.85, 0.5];
      node.children.forEach((child, i) => {
        layoutTreeFixed(child, depth + 1, angles[i] * Math.PI, node);
      });
    }
    return;
  }

  const dist = depth === 1 ? LEVEL_GAP + 60 : LEVEL_GAP;
  node._x = parentNode._x + Math.cos(parentAngle) * dist;
  node._y = parentNode._y + Math.sin(parentAngle) * dist;
  nodes.push(node);
  edges.push({ from: parentNode, to: node });

  if (node.children && node.children.length > 0) {
    const spread = Math.min(0.8, 0.22 * node.children.length);
    const startAngle = parentAngle - spread * (node.children.length - 1) / 2;
    node.children.forEach((child, i) => {
      const angle = startAngle + spread * i;
      layoutTreeFixed(child, depth + 1, angle, node);
    });
  }
}

  const x1 = e.from._x, y1 = e.from._y;
  const x2 = e.to._x, y2 = e.to._y;
  const mx = (x1 + x2) / 2;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', e.to.color + '40');
  path.setAttribute('stroke-width', '2');
  svg.appendChild(path);
});

// Render nodes
nodes.forEach(n => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.style.cursor = 'pointer';

  const isRoot = n.id === 'construct';
  const isLeaf = !n.children || n.children.length === 0;
  const rx = isRoot ? 8 : 4;
  const fontSize = isRoot ? 16 : (isLeaf ? 11 : 13);
  const w = isRoot ? measureText(n.label, 16) : (isLeaf ? measureText(n.label, 11) : n._w);
  const h = isRoot ? 36 : (isLeaf ? 24 : NODE_H);

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', n._x - w / 2);
  rect.setAttribute('y', n._y - h / 2);
  rect.setAttribute('width', w);
  rect.setAttribute('height', h);
  rect.setAttribute('rx', rx);
  rect.setAttribute('fill', isRoot ? '#21262d' : '#0d1117');
  rect.setAttribute('stroke', n.color);
  rect.setAttribute('stroke-width', isRoot ? 2 : 1);
  g.appendChild(rect);

  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', n._x);
  text.setAttribute('y', n._y + fontSize * 0.35);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('fill', n.color);
  text.setAttribute('font-size', fontSize);
  text.setAttribute('font-family', "'SF Mono','Cascadia Code','Fira Code',monospace");
  text.textContent = n.label;
  g.appendChild(text);

  // Hover effect
  g.addEventListener('mouseenter', () => {
    rect.setAttribute('fill', n.color + '18');
    rect.setAttribute('stroke-width', isRoot ? 3 : 2);
  });
  g.addEventListener('mouseleave', () => {
    rect.setAttribute('fill', isRoot ? '#21262d' : '#0d1117');
    rect.setAttribute('stroke-width', isRoot ? 2 : 1);
  });

  // Click handler
  g.addEventListener('click', (e) => {
    e.stopPropagation();
    showDetail(n);
  });

  svg.appendChild(g);
  n._el = g;
});

// ─── Detail panel ───────────────────────────────────────────────────────
function showDetail(node) {
  const detail = document.getElementById('detail');
  const d = node.detail;
  if (!d) {
    document.getElementById('detail-title').textContent = node.label;
    document.getElementById('detail-path').textContent = '';
    document.getElementById('detail-content').innerHTML = '<p style="color:#8b949e">No additional details for this leaf node.</p>';
    detail.classList.add('open');
    return;
  }

  document.getElementById('detail-title').textContent = node.label;
  document.getElementById('detail-path').textContent = d.path || '';

  let html = '';
  if (d.desc) {
    html += `<p style="color:#8b949e;margin-bottom:12px">${d.desc.replace(/\n/g,'<br>')}</p>`;
  }
  if (d.files && d.files.length) {
    html += '<h4>Files</h4><ul>';
    d.files.forEach(f => html += `<li class="file">${f}</li>`);
    html += '</ul>';
  }
  if (d.imports && d.imports.length) {
    html += '<h4>Imports</h4><ul>';
    d.imports.forEach(f => html += `<li class="import">${f}</li>`);
    html += '</ul>';
  }
  if (d.exports && d.exports.length) {
    html += '<h4>Exports</h4><ul>';
    d.exports.forEach(f => html += `<li class="export">${f}</li>`);
    html += '</ul>';
  }
  if (d.connections && d.connections.length) {
    html += '<h4>Connections</h4><ul>';
    d.connections.forEach(f => html += `<li class="conn">${f}</li>`);
    html += '</ul>';
  }

  document.getElementById('detail-content').innerHTML = html;
  detail.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

// Close on background click
svg.addEventListener('click', closeDetail);

// ─── Pan & Zoom ─────────────────────────────────────────────────────────
let isDragging = false, dragStart = { x: 0, y: 0 }, vbStart = { x: 0, y: 0 };

svg.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDragging = true;
  svg.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY };
  vbStart = { x: viewBox.x, y: viewBox.y };
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const scale = viewBox.w / svg.clientWidth;
  viewBox.x = vbStart.x - (e.clientX - dragStart.x) * scale;
  viewBox.y = vbStart.y - (e.clientY - dragStart.y) * scale;
  updateViewBox();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  svg.classList.remove('dragging');
});

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;

  const newW = viewBox.w * factor;
  const newH = viewBox.h * factor;

  viewBox.x += (viewBox.w - newW) * mx;
  viewBox.y += (viewBox.h - newH) * my;
  viewBox.w = newW;
  viewBox.h = newH;
  updateViewBox();
}, { passive: false });

// ─── Keyboard ───────────────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// ─── Connection highlights ──────────────────────────────────────────────
const KEY_CONNECTIONS = [
  { label: 'TCP :60100', from: 'fe-operator', to: 'op-transport', color: '#58a6ff' },
  { label: 'normalize', from: 'fe-assistant', to: 'op-runner', color: '#d2a8ff' },
  { label: 'agent contracts', from: 'fe-spaces', to: 'op-agent', color: '#f0883e' },
  { label: 'sidecar spawn', from: 'dt-lib', to: 'operator', color: '#f97583' },
  { label: 'bridge :60101', from: 'dt-bridge', to: 'op-desktop', color: '#ffa198' },
  { label: 'loads spaces', from: 'fe-spaceloader', to: 'fe-spaces', color: '#79c0ff' },
];

// Draw key connection arcs
KEY_CONNECTIONS.forEach(conn => {
  const fromNode = nodes.find(n => n.id === conn.from);
  const toNode = nodes.find(n => n.id === conn.to);
  if (!fromNode || !toNode) return;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const x1 = fromNode._x, y1 = fromNode._y;
  const x2 = toNode._x, y2 = toNode._y;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;

  // Curve the connection line slightly
  const dx = x2 - x1, dy = y2 - y1;
  const cx = mx - dy * 0.15, cy = my + dx * 0.15;

  path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', conn.color + '30');
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('stroke-dasharray', '6,4');

  // Insert before nodes so they appear behind
  svg.insertBefore(path, svg.firstChild);

  // Label
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const lx = (x1 + cx + x2) / 3, ly = (y1 + cy + y2) / 3;
  text.setAttribute('x', lx);
  text.setAttribute('y', ly);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('fill', conn.color + '60');
  text.setAttribute('font-size', '9');
  text.setAttribute('font-family', "'SF Mono',monospace");
  text.textContent = conn.label;
  svg.insertBefore(text, svg.firstChild.nextSibling);
});
</script>
