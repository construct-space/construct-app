<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <!-- Auto-upgrade every insecure subresource (http -> https) before the
       request is made. Fixes macOS App Transport Security blocking http images
       like TuneIn station logos (cdn-profiles.tunein.com/...logoq.jpg). Scheme-
       only rewrite; doesn't block anything, so it's safe app-wide. NOT added to
       browser.html, which loads arbitrary user sites that may be http-only. -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>Construct</title>
  <style>
    html, body { overflow: hidden; height: 100%; margin: 0; }
    #app { height: 100%; overflow: hidden; position: relative; z-index: 1; }
    #splash { pointer-events: none; }
  </style>
  <script>
    // Set background + dark class before first paint to prevent flash
    (function() {
      var id = localStorage.getItem('app-theme-id') || 'auto';
      var light = (id === 'vs' || id === 'hc-light' || (id === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches));
      document.documentElement.style.background = light ? '#f1f5f9' : '#0f172a';
      if (!light) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
