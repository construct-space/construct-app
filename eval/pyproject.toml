[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "construct-eval"
version = "0.1.0"
description = "GEPA-powered eval harness for Construct Operator agents"
requires-python = ">=3.10"
dependencies = [
    "gepa[full]",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
construct-eval = "harness:main"
construct-optimize = "run_optimization:main"
